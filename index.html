<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b12">
<title>GSK-STUDIOS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b12;color:white;font-family:Arial,sans-serif}
.wrap{max-width:600px;margin:auto;padding:20px}
.card{background:#15151f;border:1px solid #292938;border-radius:20px;padding:20px;margin-top:20px}
h1{text-align:center}
input,textarea{width:100%;padding:14px;margin-top:10px;background:#0d0d15;color:white;border:1px solid #333344;border-radius:12px}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:12px;font-weight:bold;font-size:16px}
.primary{background:white;color:black}
.secondary{background:#292938;color:white}
.hidden{display:none}
.status{text-align:center;color:#aaa;margin-top:15px}
</style>
</head>

<body>
<div class="wrap">

<div id="authBox" class="card">
<h1>GSK-STUDIOS</h1>
<p style="text-align:center;color:#aaa">Create your account</p>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button class="primary" onclick="signup()">Create Account</button>
<button class="secondary" onclick="login()">Login</button>

<div id="authStatus" class="status"></div>
</div>


<div id="appBox" class="hidden">

<div class="card">
<h1>✨ AI Creator</h1>

<textarea id="prompt" rows="6"
placeholder="Example: A cinematic portrait of a person standing in a beautiful mountain landscape..."></textarea>

<button class="primary" onclick="generateImage()">
✨ Generate AI Image
</button>

<button class="secondary" onclick="logout()">Logout</button>

<div id="status" class="status"></div>
</div>

<div class="card">
<h3>Membership</h3>
<p>🎁 1-day free trial</p>
<p>⭐ Pro — $3/month</p>
<p style="color:#999;font-size:13px">
Pricing can be changed later from the payment system.
</p>
</div>

</div>
</div>


<script>

// ===============================
// SUPABASE SETTINGS
// ===============================

const SUPABASE_URL = "https://zdirbdtnuabrvrwbsdrt.supabase.co/rest/v1/;
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_4K2s9gHsw3yapS-juUk2yg_LTQONMm2";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// ===============================
// SIGN UP
// ===============================

async function signup(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    document.getElementById("authStatus").textContent =
      "Email aur password enter karo.";
    return;
  }

  document.getElementById("authStatus").textContent =
    "Account create ho raha hai...";

  const {error} = await supabaseClient.auth.signUp({
    email: email,
    password: password
  });

  if(error){
    document.getElementById("authStatus").textContent =
      error.message;
    return;
  }

  document.getElementById("authStatus").textContent =
    "Account create ho gaya. Email check karo.";
}


// ===============================
// LOGIN
// ===============================

async function login(){

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    document.getElementById("authStatus").textContent =
      "Email aur password enter karo.";
    return;
  }

  document.getElementById("authStatus").textContent =
    "Login ho raha hai...";

  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if(error){
    document.getElementById("authStatus").textContent =
      error.message;
    return;
  }

  showApp();
}


// ===============================
// SHOW APP
// ===============================

function showApp(){

  document.getElementById("authBox")
    .classList.add("hidden");

  document.getElementById("appBox")
    .classList.remove("hidden");
}


// ===============================
// LOGOUT
// ===============================

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById("appBox")
    .classList.add("hidden");

  document.getElementById("authBox")
    .classList.remove("hidden");
}


// ===============================
// AI IMAGE
// ===============================

function generateImage(){

  const prompt =
    document.getElementById("prompt").value.trim();

  const status =
    document.getElementById("status");

  if(!prompt){

    status.textContent =
      "Pehle image ka description likho.";

    return;
  }

  status.textContent =
    "AI Image API abhi connect nahi hai. Backend connect karne ke baad yahin actual image generate hogi.";
}


// ===============================
// AUTO LOGIN CHECK
// ===============================

supabaseClient.auth.getSession()
.then(({data}) => {

  if(data.session){
    showApp();
  }

});

</script>

</body>
</html>
